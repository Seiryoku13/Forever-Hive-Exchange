name: Build and publish Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [VERSION]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate
        shell: powershell
        run: .\scripts\build.ps1 -Test
      - name: Verify standard Windows installation
        shell: powershell
        run: |
          $install = Join-Path $env:LOCALAPPDATA 'Forever Hive Exchange\App\ForeverHiveExchange.exe'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Forever Hive Exchange.lnk'
          $setup = (Resolve-Path 'bin/ForeverHiveExchange-Setup.exe').Path
          $result = Start-Process $setup -ArgumentList '--quiet','--no-launch' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw 'Standard setup failed' }
          if ((Get-FileHash $install).Hash -ne (Get-FileHash 'bin/ForeverHiveExchange.exe').Hash) { throw 'Installed binary differs' }
          if (!(Test-Path $shortcut)) { throw 'Start menu shortcut missing' }
          $shell = New-Object -ComObject WScript.Shell
          if ($shell.CreateShortcut($shortcut).TargetPath -ne $install) { throw 'Shortcut target differs' }
      - name: Publish verified artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content -Raw VERSION).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw 'Bad version' }
          $compiled = (Get-Item bin/ForeverHiveExchange.exe).VersionInfo.FileVersion
          if ([version]$compiled -ne [version]("$v.0")) { throw 'Source and release versions differ' }
          gh release create "v$v" bin/ForeverHiveExchange.exe bin/ForeverHiveExchange-Setup.exe --target "$env:GITHUB_SHA" --title "Forever Hive Exchange $v" --notes-file CHANGELOG.md
          if ($LASTEXITCODE) { throw 'GitHub release failed' }
